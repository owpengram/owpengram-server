# telesrv 第一阶段三方依赖（开发用）。
#
#   启动：  docker compose up -d
#   状态：  docker compose ps
#   关停：  docker compose down          （保留数据卷）
#   清空：  docker compose down -v        （连数据卷一起删，重置 schema/数据）
#
# server 端连接串见 internal/config/config.go 的默认值（localhost:5432 / localhost:6399）。
#
# 容器/卷命名可通过 TELESRV_DOCKER_PROJECT / TELESRV_DOCKER_PREFIX 覆盖（默认 owpengram）：
# start-server.sh 对已存在 telesrv_* 卷、且用户拒绝一次性改名迁移的安装，会把这两个变量
# 固定设为 telesrv，从而永久保留旧命名，不动用户现有的 telesrv_pgdata / telesrv_redisdata。
name: ${TELESRV_DOCKER_PROJECT:-owpengram}

services:
  postgres:
    image: postgres:17-alpine
    container_name: ${TELESRV_DOCKER_PREFIX:-owpengram}-postgres
    # 全库已去分区（普通表），max_locks_per_transaction 默认 64 已够；512 仅留余量，对内存近乎零开销。
    # pg_stat_statements：聚合各 SQL 的累计/平均耗时与调用次数，用于定位 postgres 容器 CPU 热点
    # （telesrv 是宿主进程，docker stats 里的 CPU 尖峰是本容器）。需 CREATE EXTENSION 后才有视图：
    #   docker exec -i owpengram-postgres psql -U telesrv -d telesrv -c "CREATE EXTENSION IF NOT EXISTS pg_stat_statements;"
    command:
      - "postgres"
      - "-c"
      - "max_locks_per_transaction=512"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "track_io_timing=on"
    environment:
      # Only take effect when Postgres bootstraps a brand-new, empty data
      # volume; a pre-existing volume ignores these and keeps whatever
      # role/database name it was originally initialized with. See
      # deploy/migrate-db-naming.ps1 for renaming an existing telesrv-named
      # role/database in-place.
      POSTGRES_DB: owpengram
      POSTGRES_USER: owpengram
      POSTGRES_PASSWORD: owpengram
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432" # <-- ЗАХИЩЕНО (доступ тільки з 127.0.0.1)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owpengram -d owpengram"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ${TELESRV_DOCKER_PREFIX:-owpengram}-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6399:6379" # <-- ЗАХИЩЕНО (доступ тільки з 127.0.0.1)
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # S3 兼容对象存储，默认 blob backend（见 .env.example 的 TELESRV_BLOB_BACKEND=s3）。
  # 桶由 telesrv 自己在启动时按需创建（internal/app/files/blobs3.go 的 NewS3FS），
  # 这里不需要额外的 mc 初始化容器。控制台（9001）仅用于本地调试查看已存对象。
  minio:
    # bitnamilegacy, not minio/minio: MinIO's own images stopped serving
    # anonymous pulls on BOTH registries -- Docker Hub answers "pull access
    # denied ... or may require 'docker login'" and quay.io answers 401
    # Unauthorized, for every tag, not just latest. Bitnami then moved its
    # free images out of `bitnami/` (now "not found") into `bitnamilegacy/`,
    # which still pulls with no login.
    #
    # These images are archived: frozen at MinIO 2025.5.24, no further
    # updates or security patches. That is the trade being made here -- a
    # working `docker compose up` today, on a store that nobody maintains.
    #
    # (chainguard/minio pulls too, but refuses to start without host-side
    # ownership work on its data directory, so it is not a swap-in.)
    #
    # Bitnami's layout differs from the official image: its own entrypoint
    # (so no `command:` override), data under /bitnami/minio/data rather
    # than /data, and it runs as uid 1001. MINIO_DEFAULT_BUCKETS is a
    # Bitnami addition that creates the bucket on first start.
    #
    # A FRESH install needs nothing extra: Docker seeds a new named volume
    # from the image, ownership included. An install that already has a
    # volume written by the official image does, because that one is
    # root-owned and uid 1001 cannot write to it -- the container then
    # restart-loops on
    # "/bitnami/minio/data/.root_user: Permission denied". Hand it over
    # once, with the container stopped:
    #
    #   docker compose stop minio
    #   docker run --rm -v <prefix>_miniodata:/d alpine chown -R 1001:1001 /d
    #   docker compose up -d minio
    #
    # The stored objects themselves are untouched by this and stay readable.
    image: bitnamilegacy/minio:latest
    container_name: ${TELESRV_DOCKER_PREFIX:-owpengram}-minio
    environment:
      MINIO_ROOT_USER: ${TELESRV_S3_ACCESS_KEY_ID:-owpengram}
      MINIO_ROOT_PASSWORD: ${TELESRV_S3_SECRET_ACCESS_KEY:-owpengram123}
      MINIO_DEFAULT_BUCKETS: ${TELESRV_S3_BUCKET:-owpengram-media}
    ports:
      - "127.0.0.1:9000:9000" # <-- якщо S3 використовує тільки локальний бекенд
      - "127.0.0.1:9001:9001" # <-- Web UI Minio (можна залишити без 127.0.0.1, якщо потрібен адмін-веб ззовні)
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
    name: ${TELESRV_DOCKER_PREFIX:-owpengram}_pgdata
  redisdata:
    name: ${TELESRV_DOCKER_PREFIX:-owpengram}_redisdata
  miniodata:
    name: ${TELESRV_DOCKER_PREFIX:-owpengram}_miniodata