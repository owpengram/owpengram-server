# Decisions for the Telegram compatibility map (docs/COMPATIBILITY.md).
#
# The map itself is generated from code by `go run ./cmd/tl-coverage`. This
# file only holds what code cannot tell: why something is not done, and what
# matters most. Edit it, then regenerate.
#
#   match:    exact TL method ("messages.sendMessage") or "namespace.*".
#             An exact match wins over a pattern.
#   status:   skip    -- not planned; the note says why (only applies while
#                        the method is not served)
#             planned -- will be done (combine with priority)
#             edge    -- served below the RPC dispatcher (MTProto envelopes)
#   priority: P1 (clients hit it in normal use) / P2 (feature gap) / P3 (nice to have)
#   note:     one line, shown in the map

# --- Served by the MTProto edge, not by registerRPC --------------------------
- match: invokeAfterMsg
  status: edge
  note: Transparent envelope, unwrapped by tlprofile before dispatch.
- match: invokeAfterMsgs
  status: edge
  note: Transparent envelope, unwrapped by tlprofile before dispatch.
- match: invokeWithLayer
  status: edge
  note: Selects the client's exact Layer profile.
- match: initConnection
  status: edge
  note: Client info (app, device, system, lang) recorded per session.
- match: invokeWithoutUpdates
  status: edge
  note: Transparent envelope, unwrapped by tlprofile before dispatch.
- match: invokeWithMessagesRange
  status: edge
  note: Transparent envelope; the range itself is not used (takeout only).
- match: invokeWithTakeout
  status: edge
  note: Transparent envelope; takeout sessions are not implemented (see account.initTakeoutSession).
- match: invokeWithBusinessConnection
  status: edge
  note: Transparent envelope; business-connection routing for bots is not implemented.
- match: invokeWithApnsSecret
  status: edge
  note: Apple push verification envelope, accepted and ignored.
- match: invokeWithGooglePlayIntegrity
  status: edge
  note: Google Play integrity envelope, accepted and ignored.
- match: invokeWithReCaptcha
  status: edge
  note: reCAPTCHA envelope, accepted and ignored.

# --- Not planned: Telegram-only infrastructure ------------------------------
- match: smsjobs.*
  status: skip
  note: Telegram's "send SMS for Telegram" program; no meaning on a self-hosted server.
- match: wallet.*
  status: skip
  note: Telegram's custodial TON wallet. Needs real TON integration first; see the platform roadmap.
- match: toncenter.*
  status: skip
  note: Proxy to Telegram's TON Center; belongs to the wallet.
- match: test.*
  status: skip
  note: Telegram's internal test methods.
